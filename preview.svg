<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" aria-label="Web Danışmanı kredi kartı mockup animasyonu">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171a36"/><stop offset=".52" stop-color="#3a2a80"/><stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e2a0"/><stop offset=".5" stop-color="#c9a24a"/><stop offset="1" stop-color="#f3dc93"/>
    </linearGradient>
    <radialGradient id="b1"><stop offset="0" stop-color="#7c5cff" stop-opacity=".45"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="b2"><stop offset="0" stop-color="#22d3ee" stop-opacity=".3"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="shine" cx=".9" cy="0" r="1"><stop offset="0" stop-color="#fff" stop-opacity=".25"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <clipPath id="clip"><rect x="260" y="92" width="360" height="227" rx="18"/></clipPath>
  </defs>

  <style>
    text { font-family: "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; fill: #fff; }
    .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; }
    .lbl { font-size: 8px; letter-spacing: 1.6px; opacity: .65; }
    .a { animation-duration: 12s; animation-iteration-count: infinite; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
    .flip { transform-origin: 440px 205px; }
    .k6 { animation-name: k6 } .k12 { animation-name: k12 } .k18 { animation-name: k18 } .k24 { animation-name: k24 }
    .k30 { animation-name: k30 } .k38 { animation-name: k38 } .k58 { animation-name: k58 } .k61 { animation-name: k61 } .k64 { animation-name: k64 }
    .ff { animation-name: ff } .fb { animation-name: fb }
    .ok { animation-name: ok; transform-origin: 620px 92px; }
    .float { animation: fl 6s ease-in-out infinite; }
    @keyframes fl { 50% { transform: translateY(-6px) } }
    @keyframes k6  { 0%, 6%  { opacity: 0; transform: translateY(9px) } 9%,  92% { opacity: 1; transform: none } 96%, 100% { opacity: 0 } }
    @keyframes k12 { 0%, 12% { opacity: 0; transform: translateY(9px) } 15%, 92% { opacity: 1; transform: none } 96%, 100% { opacity: 0 } }
    @keyframes k18 { 0%, 18% { opacity: 0; transform: translateY(9px) } 21%, 92% { opacity: 1; transform: none } 96%, 100% { opacity: 0 } }
    @keyframes k24 { 0%, 24% { opacity: 0; transform: translateY(9px) } 27%, 92% { opacity: 1; transform: none } 96%, 100% { opacity: 0 } }
    @keyframes k30 { 0%, 30% { opacity: 0; transform: translateY(9px) } 33%, 92% { opacity: 1; transform: none } 96%, 100% { opacity: 0 } }
    @keyframes k38 { 0%, 38% { opacity: 0; transform: translateY(9px) } 41%, 92% { opacity: 1; transform: none } 96%, 100% { opacity: 0 } }
    @keyframes k58 { 0%, 58% { opacity: 0; transform: translateY(9px) } 60%, 92% { opacity: 1; transform: none } 96%, 100% { opacity: 0 } }
    @keyframes k61 { 0%, 61% { opacity: 0; transform: translateY(9px) } 63%, 92% { opacity: 1; transform: none } 96%, 100% { opacity: 0 } }
    @keyframes k64 { 0%, 64% { opacity: 0; transform: translateY(9px) } 66%, 92% { opacity: 1; transform: none } 96%, 100% { opacity: 0 } }
    @keyframes ff { 0%, 46% { transform: scaleX(1) } 50%, 74% { transform: scaleX(0) } 78%, 100% { transform: scaleX(1) } }
    @keyframes fb { 0%, 50% { transform: scaleX(0) } 54%, 70% { transform: scaleX(1) } 74%, 100% { transform: scaleX(0) } }
    @keyframes ok { 0%, 82% { opacity: 0; transform: scale(.5) } 86%, 93% { opacity: 1; transform: scale(1) } 96%, 100% { opacity: 0; transform: scale(1) } }
  </style>

  <!-- zemin -->
  <rect width="880" height="440" rx="22" fill="#0a0c13"/>
  <circle cx="120" cy="60" r="260" fill="url(#b1)"/>
  <circle cx="800" cy="380" r="240" fill="url(#b2)"/>

  <text x="440" y="48" text-anchor="middle" font-size="17" font-weight="600">Web Danışmanı · Kredi Kartı Mockup</text>

  <g class="float">
    <ellipse cx="440" cy="340" rx="150" ry="10" fill="#000" opacity=".45"/>

    <!-- ÖN YÜZ -->
    <g class="a flip ff">
      <g clip-path="url(#clip)">
        <rect x="260" y="92" width="360" height="227" fill="url(#card)"/>
        <rect x="260" y="92" width="360" height="227" fill="url(#shine)"/>
        <circle cx="640" cy="350" r="120" fill="none" stroke="#fff" stroke-opacity=".06"/>
        <circle cx="640" cy="350" r="150" fill="none" stroke="#fff" stroke-opacity=".06"/>
        <circle cx="640" cy="350" r="180" fill="none" stroke="#fff" stroke-opacity=".06"/>
      </g>
      <rect x="260.500" y="92.500" width="359" height="226" rx="18" fill="none" stroke="#fff" stroke-opacity=".16"/>
      <path d="M284 119l4.500 11 4.500-9.500 4.500 9.500 4.500-11" fill="none" stroke="#fff" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="310" y="130" font-size="13.500" font-weight="600">Web Danışmanı</text>
      <text x="596" y="129" text-anchor="end" class="lbl">GECE MAVİSİ</text>
      <rect x="284" y="150" width="42" height="32" rx="6" fill="url(#chip)"/>
      <path d="M284 161h13M284 171h13M313 161h13M313 171h13M297 150v32M313 150v32M297 166h16" stroke="#000" stroke-opacity=".3" fill="none"/>
      <path d="M338 158a11 11 0 010 16M344 154a17 17 0 010 24" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="1.800" stroke-linecap="round"/>

      <g class="mono" font-size="22" font-weight="500">
        <text class="a k6" x="284" y="232">5412</text>
        <text class="a k12" x="363" y="232">7500</text>
        <text class="a k18" x="442" y="232">0000</text>
        <text class="a k24" x="521" y="232">1234</text>
      </g>
      <text x="284" y="268" class="lbl">KART SAHİBİ</text>
      <text class="a k30" x="284" y="289" font-size="13.500" font-weight="500" letter-spacing=".8">DENİZ YILMAZ</text>
      <text x="596" y="268" text-anchor="end" class="lbl">SON KULLANMA</text>
      <text class="a k38 mono" x="596" y="289" text-anchor="end" font-size="13.500" font-weight="500">08/29</text>
    </g>

    <!-- ARKA YÜZ -->
    <g class="a flip fb">
      <rect x="260" y="92" width="360" height="227" rx="18" fill="url(#card)"/>
      <rect x="260.500" y="92.500" width="359" height="226" rx="18" fill="none" stroke="#fff" stroke-opacity=".16"/>
      <rect x="260" y="118" width="360" height="42" fill="#0d0d11"/>
      <rect x="284" y="184" width="232" height="36" rx="5" fill="#e6e7ed"/>
      <path d="M296 207c14-14 22 8 36-4s20 6 34-2 18 4 30-3" fill="none" stroke="#23253a" stroke-width="1.600" stroke-linecap="round"/>
      <rect x="524" y="184" width="72" height="36" rx="5" fill="#fff" stroke="#fff" stroke-opacity=".4" stroke-width="5"/>
      <text x="589" y="195" text-anchor="end" font-size="6.500" style="fill:#14162a" opacity=".55" letter-spacing="1.200">CVV</text>
      <g class="mono" font-size="16" font-weight="600">
        <text class="a k58" x="547" y="213" style="fill:#14162a">1</text>
        <text class="a k61" x="562" y="213" style="fill:#14162a">2</text>
        <text class="a k64" x="577" y="213" style="fill:#14162a">3</text>
      </g>
      <rect x="284" y="240" width="190" height="4" rx="2" fill="#fff" opacity=".22"/>
      <rect x="284" y="251" width="150" height="4" rx="2" fill="#fff" opacity=".16"/>
      <rect x="284" y="278" width="46" height="26" rx="5" fill="url(#acc)" opacity=".85"/>
      <text x="596" y="297" text-anchor="end" font-size="11" font-weight="600" opacity=".9">Web Danışmanı</text>
    </g>

    <!-- başarı rozeti -->
    <g class="a ok">
      <circle cx="620" cy="92" r="21" fill="#34d399"/>
      <path d="M610 92.500l7 7 13-14" fill="none" stroke="#06281c" stroke-width="3.400" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- adımlar -->
  <g font-size="11" font-weight="600" text-anchor="middle">
    <path d="M335 388h210" stroke="#fff" stroke-opacity=".12" stroke-width="2"/>
    <g>
      <circle cx="335" cy="388" r="13" fill="#151823" stroke="#fff" stroke-opacity=".18"/><text x="335" y="392" opacity=".6">1</text>
      <circle cx="405" cy="388" r="13" fill="#151823" stroke="#fff" stroke-opacity=".18"/><text x="405" y="392" opacity=".6">2</text>
      <circle cx="475" cy="388" r="13" fill="#151823" stroke="#fff" stroke-opacity=".18"/><text x="475" y="392" opacity=".6">3</text>
      <circle cx="545" cy="388" r="13" fill="#151823" stroke="#fff" stroke-opacity=".18"/><text x="545" y="392" opacity=".6">4</text>
    </g>
    <g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <g class="a k24"><circle cx="335" cy="388" r="13" fill="url(#acc)" stroke="none"/><path d="M329.500 388.500l4 4 7-8"/></g>
      <g class="a k30"><circle cx="405" cy="388" r="13" fill="url(#acc)" stroke="none"/><path d="M399.500 388.500l4 4 7-8"/></g>
      <g class="a k38"><circle cx="475" cy="388" r="13" fill="url(#acc)" stroke="none"/><path d="M469.500 388.500l4 4 7-8"/></g>
      <g class="a k64"><circle cx="545" cy="388" r="13" fill="url(#acc)" stroke="none"/><path d="M539.500 388.500l4 4 7-8"/></g>
    </g>
  </g>
  <g font-size="10" text-anchor="middle" opacity=".55">
    <text x="335" y="420">Numara</text><text x="405" y="420">İsim</text><text x="475" y="420">Tarih</text><text x="545" y="420">CVV</text>
  </g>
</svg>
